# Final last-mile 4-sort check (reusable workflow): paper (LaTeX) vs kernel-checked Lean.
# Called by certify.yml with `needs: certify`, so it runs LAST, on the oleans the certify job built from
# the committed lean-toolchain / lake-manifest.json. It never edits anything: it reports, and halts
# (non-zero exit) unless every paper claim is PROVED, EXTERNAL or NOT-CLAIMED. See FINAL_CHECK.md.
name: Final 4-sort (reusable)

on:
  workflow_call:
    inputs:
      build-artifact:
        description: Name of the artifact holding .lake/build/lib uploaded by the certify job
        required: true
        type: string
      claim-map:
        description: Path of the claim map
        required: false
        default: final-check/claim-map.json
        type: string

permissions:
  contents: read

jobs:
  final-4sort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (toolchain pinned by lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Get Mathlib cache (from the committed lake-manifest.json; never rebuilds Mathlib)
        run: |
          git diff --quiet HEAD -- lake-manifest.json lean-toolchain
          if grep -q '"name": *"mathlib"' lake-manifest.json; then lake exe cache get; fi
      - name: Restore the oleans built by the certify job (no rebuild)
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.build-artifact }}
          path: .lake/build/lib
      - name: Final 4-sort (report and halt only)
        run: |
          set -o pipefail
          mkdir -p 4sort-out
          python3 scripts/final_4sort.py --map "${{ inputs.claim-map }}" --sha "${{ github.sha }}" \
            --out "4sort-out/4sort-report-${{ github.sha }}" 2>&1 | tee 4sort-out/4sort-console.log
      - name: Job summary
        if: always()
        run: |
          f="4sort-out/4sort-report-${{ github.sha }}/4sort-report.md"
          if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; else echo "No 4-sort report was written (see the previous step's log)." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload 4-sort report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 4sort-report-${{ github.sha }}
          path: 4sort-out/
          if-no-files-found: error
