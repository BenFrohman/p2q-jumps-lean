name: Lean certificate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (toolchain pinned by lean-toolchain = leanprover/lean4:v4.26.0)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Get Mathlib cache
        run: lake exe cache get
      - name: Build + axiom audit from the committed lake-manifest.json
        id: bundle
        run: |
          set +e
          scripts/cert-bundle.sh > bundle.out; rc=$?
          out=$(tail -1 bundle.out)
          echo "dir=$out" >> "$GITHUB_OUTPUT"
          cp "$out/print-axioms.log" axioms.txt 2>/dev/null
          mkdir -p cert-out
          cp "$out/lake-build.log" cert-out/lake-build.log 2>/dev/null
          cp "$out/print-axioms.log" cert-out/axioms.txt 2>/dev/null
          exit $rc
      - name: Upload certificate (passed builds only)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: certificate-${{ github.sha }}
          path: certificates/passed/
          if-no-files-found: error
      - name: Upload failed-attempt log (NOT a certificate)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-attempt-log-NOT-A-CERTIFICATE-${{ github.sha }}
          path: certificates/attempt-logs/
          if-no-files-found: ignore
      - name: Check axioms are standard only
        run: |
          test -s axioms.txt
          if grep -vE "depends on axioms: \[(propext|Classical\.choice|Quot\.sound)(, (propext|Classical\.choice|Quot\.sound))*\]$|does not depend on any axioms$" axioms.txt | grep -q .; then
            echo "Non-standard axiom output:"; cat axioms.txt; exit 1; fi
      - name: No sorry / no axiom declarations
        run: python3 scripts/check_no_sorry.py
      - name: Collect lake-manifest provenance
        if: always()
        run: |
          mkdir -p cert-out
          if [ -f axioms.txt ] && [ ! -f cert-out/axioms.txt ]; then
            cp -a axioms.txt cert-out/axioms.txt
          fi
          if [ -f lake-manifest.json ]; then
            cp -a lake-manifest.json cert-out/lake-manifest.json
            sha256sum lake-manifest.json | tee cert-out/lake-manifest.json.sha256sum
            awk '{print $1}' cert-out/lake-manifest.json.sha256sum > cert-out/lake-manifest.json.sha256
          else
            echo "MISSING: lake-manifest.json was not present in the checkout" | tee cert-out/MISSING-lake-manifest.txt
          fi
          if [ -f lean-toolchain ]; then
            cp -a lean-toolchain cert-out/lean-toolchain
            sha256sum lean-toolchain | tee cert-out/lean-toolchain.sha256sum
            awk '{print $1}' cert-out/lean-toolchain.sha256sum > cert-out/lean-toolchain.sha256
          else
            echo "MISSING: lean-toolchain was not present in the checkout" | tee cert-out/MISSING-lean-toolchain.txt
          fi
          {
            echo "commit: $(git rev-parse HEAD 2>/dev/null || echo not available)"
            echo "github_sha: ${GITHUB_SHA:-not set in environment}"
            echo "github_run_id: ${GITHUB_RUN_ID:-not set in environment}"
            echo "github_run_attempt: ${GITHUB_RUN_ATTEMPT:-not set in environment}"
            echo "github_event_name: ${GITHUB_EVENT_NAME:-not set in environment}"
            echo "github_repository: ${GITHUB_REPOSITORY:-not set in environment}"
            echo "elan --version:"
            if command -v elan >/dev/null 2>&1; then elan --version; else echo "elan was not on PATH"; fi
            echo "lake --version:"
            if command -v lake >/dev/null 2>&1; then lake --version; else echo "lake was not on PATH"; fi
            echo "lean --version:"
            if command -v lean >/dev/null 2>&1; then lean --version; else echo "lean was not on PATH"; fi
          } > cert-out/versions.txt 2>&1
          cat cert-out/versions.txt
          python3 -c '
          import json, pathlib
          dest = pathlib.Path("cert-out/mathlib-rev.txt")
          manifest = pathlib.Path("lake-manifest.json")
          if not manifest.exists():
              dest.write_text("Mathlib rev: not available; lake-manifest.json missing\n")
              raise SystemExit(0)
          try:
              data = json.loads(manifest.read_text())
          except Exception as e:
              dest.write_text("Mathlib rev: could not parse lake-manifest.json (%s)\n" % e)
              raise SystemExit(0)
          lines = []
          found = False
          for pkg in data.get("packages") or []:
              if pkg.get("name") == "mathlib":
                  lines.append("name: mathlib")
                  lines.append("rev: %s" % pkg.get("rev"))
                  lines.append("inputRev: %s" % pkg.get("inputRev"))
                  lines.append("url: %s" % pkg.get("url"))
                  found = True
                  break
          if not found:
              lines.append("Mathlib rev: no package named mathlib in lake-manifest.json")
          dest.write_text("\n".join(lines) + "\n")
          '
      - name: Upload certificate files (passed builds only)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lean-certificate
          path: cert-out/
      - name: Upload provenance of a failed attempt (NOT a certificate)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lean-provenance-FAILED-NOT-A-CERTIFICATE
          path: cert-out/
